name: Test CI

on:
    push:
        branches-ignore:
            - gh-pages
            - browser
    pull_request:
        branches:
            - "*"
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Test
              uses: actions/checkout@v4
            - run: |
                  npm i -D eslint@8 
            - run: |
                  npx eslint src
            - run: |
                  npm test