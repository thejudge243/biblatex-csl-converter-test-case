name: Test CI

on:
    push:
        branches-ignore:
            - gh-pages
            - browser
    pull_request:
        branches:
            - "*"
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: '18'
            - run: |
                npm install
                npm test